name: Update VPN Subscription

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch, rename to Бахмут VPN #N🇺🇦 and save sub.txt
        run: |
          node -e '
            const fs = require("fs");

            const SOURCES = [
              "https://us-east.bltscdn.com/v2/688a9058-57cf-43cc-b45a-b3b921d47a19"
            ];

            async function run() {
              let allLinks = [];

              for (const url of SOURCES) {
                const res = await fetch(url, {
                  headers: {
                    "User-Agent": "v2rayNG/1.8.23",
                    "Accept": "*/*"
                  }
                });

                if (!res.ok) {
                  throw new Error(`HTTP ${res.status} for ${url}`);
                }

                let raw = (await res.text()).trim();

                if (!raw.includes("://")) {
                  try {
                    const decoded = Buffer.from(raw, "base64").toString("utf8");
                    if (decoded.includes("://")) {
                      raw = decoded;
                    }
                  } catch (e) {}
                }

                const links = raw
                  .split(/\r?\n/)
                  .map(line => line.trim())
                  .filter(line => line.includes("://"));

                allLinks.push(...links);
              }

              if (allLinks.length === 0) {
                throw new Error("No valid proxy links found");
              }

              const renamed = allLinks.map((link, idx) => {
                const name = encodeURIComponent(`Бахмут VPN #${idx + 1}🇺🇦`);
                const base = link.split("#")[0];
                return `${base}#${name}`;
              });

              fs.writeFileSync("sub.txt", renamed.join("\n") + "\n", "utf8");
              console.log(`Updated ${renamed.length} servers as Бахмут VPN #N🇺🇦`);
            }

            run().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git diff --staged --quiet || git commit -m "Update Бахмут VPN subscription"
          git push
