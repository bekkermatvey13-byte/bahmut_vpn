name: Update VPN Subscription

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and merge VLESS nodes
        run: |
          python3 - << 'EOF'
          import base64
          import re
          import urllib.request
          from urllib.parse import urlparse, quote

          SUBSCRIPTION_TITLE = "Бахмут VPN 🇺🇦"

          PRIMARY_URLS = [
              "https://us-east.bltscdn.com/sub/bolt",
              "https://us-east.bltscdn.com/sub",
          ]

          USER_AGENTS = [
              "v2rayNG/1.8.23",
              "Happ/1.0",
              "Streisand/1.0",
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
          ]

          def decode_maybe_base64(text: str) -> str:
              cleaned = text.strip()
              if "vless://" in cleaned:
                  return cleaned
              try:
                  pad = len(cleaned) % 4
                  if pad:
                      cleaned += "=" * (4 - pad)
                  decoded = base64.b64decode(cleaned).decode("utf-8", errors="ignore")
                  if "vless://" in decoded:
                      return decoded
              except Exception:
                  pass
              return text

          def fetch_primary(url: str) -> list[str]:
              for ua in USER_AGENTS:
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": ua,
                              "Accept": "*/*",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          raw = resp.read().decode("utf-8", errors="ignore")
                          decoded = decode_maybe_base64(raw)
                          nodes = re.findall(r"vless://[^\s\"'<>\\]+", decoded)
                          if nodes:
                              print(f"[OK] {url} (UA: {ua}) -> {len(nodes)} nodes")
                              return nodes
                          else:
                              preview = raw[:120].replace("\n", " ")
                              print(f"[EMPTY] {url} (UA: {ua}) -> status {resp.status}, body: {preview}")
                  except Exception as e:
                      print(f"[FAIL] {url} (UA: {ua}) -> {e}")
              return []

          def node_key(uri: str) -> str:
              base = uri.split("#", 1)[0]
              p = urlparse(base)
              return f"{p.username}@{p.hostname}:{p.port}"

          # 1. Загружаем ручные узлы из manual.txt
          manual_nodes = []
          try:
              with open("manual.txt", "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line.startswith("vless://"):
                          manual_nodes.append(line)
          except FileNotFoundError:
              pass

          # 2. Загружаем узлы только из исходной подписки
          primary_nodes = []
          for url in PRIMARY_URLS:
              found = fetch_primary(url)
              if found:
                  primary_nodes.extend(found)
                  break

          # 3. Объединяем без дубликатов и переименовываем
          seen = set()
          final_nodes = []
          idx = 1

          for uri in manual_nodes + primary_nodes:
              key = node_key(uri)
              if not key or key in seen:
                  continue
              seen.add(key)
              base = uri.split("#", 1)[0]
              label = quote(f"Бахмут VPN #{idx}🇺🇦")
              final_nodes.append(f"{base}#{label}")
              idx += 1

          # 4. Формируем заголовок подписки и записываем sub.txt
          title_b64 = base64.b64encode(SUBSCRIPTION_TITLE.encode("utf-8")).decode("ascii")
          header_lines = [
              f"#profile-title: base64:{title_b64}",
              "#profile-update-interval: 1",
          ]

          with open("sub.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(header_lines + final_nodes) + "\n")

          print(f"Saved {len(final_nodes)} nodes ({len(manual_nodes)} manual + {len(final_nodes) - len(manual_nodes)} from primary).")
          EOF

      - name: Commit and push updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          if ! git diff --staged --quiet; then
            git commit -m "Update subscription from primary source"
            git push
          else
            echo "No changes to commit"
          fi
